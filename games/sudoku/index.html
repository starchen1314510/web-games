<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数独 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">数独 <small>SUDOKU</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">数独</div>
                    <p class="overlay-desc" id="ov-desc">
                        每行、每列、每个九宫格里 1-9 各出现一次。点格子后用下方数字键或键盘填数。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始解题</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">进度</div>
                    <div class="panel-row"><span>剩余空格</span><b id="left">81</b></div>
                    <div class="panel-row"><span>用时</span><b id="timer">00:00</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">轻松</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">普通</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">困难</button>
                    </div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>战绩</span><b id="record">0 局完成</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>选格</span><span>点击格子</span></div>
                        <div><span>填数</span><span><kbd>1</kbd>-<kbd>9</kbd></span></div>
                        <div><span>擦除</span><span><kbd>Del</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="hint-btn">提示一格</button>
                <button class="btn btn-ghost btn-sm" id="check-btn">检查对错</button>
                <button class="btn btn-ghost btn-sm" id="new-btn">换一题</button>
            </aside>
        </div>
    </div>

    <script src="sudoku.js"></script>
</body>

</html>
