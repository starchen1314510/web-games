<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>连连看 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">连连看 <small>LINK GAME</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <div class="link-board" id="board">
                    <svg class="link-path" id="path" viewBox="0 0 432 432" preserveAspectRatio="none"></svg>
                </div>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">连连看</div>
                    <p class="overlay-desc" id="ov-desc">
                        点击两张相同的图案，路径最多拐两个弯就能消除。全部消完即过关，用最短的时间挑战自己。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>用时<b id="ov-score-val">0s</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始挑战</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">剩余对数</div>
                    <div class="panel-value" id="left">32</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>用时</span><b id="time">0s</b></div>
                    <div class="panel-row"><span>最佳用时</span><b id="best">--</b></div>
                    <div class="panel-row"><span>连击</span><b id="combo">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">轻松 6 × 6</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">标准 8 × 8</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">困难 10 × 10</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>选牌</span><span>点击 / 轻点</span></div>
                        <div><span>取消</span><span>再点一次</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="hint-btn">提示 × 3</button>
                <button class="btn btn-ghost btn-sm" id="shuffle-btn">洗牌 × 3</button>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="linkgame.js"></script>
</body>

</html>
