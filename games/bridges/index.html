<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数桥 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">数桥 <small>HASHI</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">数桥</div>
                    <p class="overlay-desc" id="ov-desc">
                        每座岛上的数字，代表与它相连的桥数。相邻两岛之间可以连一到两条桥，把全部岛屿连成一片即胜。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>用时<b id="ov-score-val">0:00</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始解谜</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一题</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">状态</div>
                    <div class="panel-value small" id="status">等待开始</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>已满足</span><b id="done">0 / 16</b></div>
                    <div class="panel-row"><span>桥</span><b id="moves">0</b></div>
                    <div class="panel-row"><span>用时</span><b id="time">0:00</b></div>
                    <div class="panel-row"><span>最佳</span><b id="best-time">--</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">岛屿数量</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">少</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">中</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">多</button>
                    </div>
                    <div class="panel-row" style="margin-top:10px"><span>当前</span><b id="level">16 岛</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>连桥</span><span>先点一座岛</span></div>
                        <div><span>加减</span><span>再点邻岛循环</span></div>
                        <div><span>规则</span><span>桥数须与数字相等</span></div>
                        <div><span>重开</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">换一道题</button>
            </aside>
        </div>
    </div>

    <script src="bridges.js"></script>

</body>

</html>
