<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>像素鸟 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">像素鸟 <small>FLAPPY BIRD</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">像素鸟</div>
                    <p class="overlay-desc" id="ov-desc">
                        点击或按空格拍动翅膀，穿过管道缝隙。每穿过一根管道得一分，撞到管道或落地就结束。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始飞行</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一次</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">得分</div>
                    <div class="panel-value" id="score">0</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>穿过管道</span><b id="pipes">0</b></div>
                    <div class="panel-row"><span>速度</span><b id="speed">1.0×</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>拍翅</span><span>点击 / <kbd>空格</kbd></span></div>
                        <div><span>暂停</span><span><kbd>P</kbd> / <kbd>Esc</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="flappy.js"></script>
</body>

</html>
