<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数织 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">数织 <small>NONOGRAM</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">数织</div>
                    <p class="overlay-desc" id="ov-desc">
                        按行与列边缘的数字提示涂黑格子。数字表示连续黑格的长度，顺序即为出现的顺序。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始推演</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">进度</div>
                    <div class="panel-row"><span>已填黑格</span><b id="filled">0 / 0</b></div>
                    <div class="panel-row"><span>用时</span><b id="timer">00:00</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-size="8">8 × 8</button>
                        <button class="btn btn-ghost btn-sm active" data-size="10">10 × 10</button>
                        <button class="btn btn-ghost btn-sm" data-size="12">12 × 12</button>
                    </div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>完成局数</span><b id="record">0</b></div>
                    <div class="panel-row"><span>最快</span><b id="besttime">--</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>涂黑 / 擦除</span><span>点击拖动</span></div>
                        <div><span>打叉标记</span><span>右键 / 长按</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="hint-btn">提示一格</button>
                <button class="btn btn-ghost btn-sm" id="check-btn">检查错误</button>
                <button class="btn btn-ghost btn-sm" id="new-btn">换一题</button>
            </aside>
        </div>
    </div>

    <script src="nonogram.js"></script>
</body>

</html>
