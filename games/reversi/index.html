<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>黑白棋 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">黑白棋 <small>REVERSI</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">黑白棋</div>
                    <p class="overlay-desc" id="ov-desc">
                        你执黑先行。落子后夹住对方的棋子就把它翻成自己的颜色，最后棋子多的一方获胜。
                    </p>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始对局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">局面</div>
                    <div class="panel-row"><span>黑棋（你）</span><b id="black">2</b></div>
                    <div class="panel-row"><span>白棋（电脑）</span><b id="white">2</b></div>
                    <div class="panel-row"><span>当前</span><b id="turn">等你开局</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">轻松</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">普通</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">困难</button>
                    </div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>战绩</span><b id="wins">0 胜 / 0 局</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>落子</span><span>点击棋盘</span></div>
                        <div><span>重来</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="reversi.js"></script>
</body>

</html>
