<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>乒乓球 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">乒乓球 <small>PONG</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">乒乓球</div>
                    <p class="overlay-desc" id="ov-desc">
                        移动左侧球拍接住来球，击球的位置决定反弹角度。球每被击打一次就更快一点，先拿到 7 分者获胜。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>比分<b id="ov-score-val">0 : 0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始比赛</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">比分</div>
                    <div class="panel-value" id="scoreline">0 : 0</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>你</span><b id="p-score">0</b></div>
                    <div class="panel-row"><span>电脑</span><b id="a-score">0</b></div>
                    <div class="panel-row"><span>最长回合</span><b id="rally">0</b></div>
                    <div class="panel-row"><span>球速</span><b id="speed">1.0×</b></div>
                    <div class="panel-row"><span>最佳回合</span><b id="best">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">轻松</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">普通</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">困难</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动</span><span>鼠标 / ↑ ↓</span></div>
                        <div><span>暂停</span><span><kbd>P</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="pong.js"></script>
</body>

</html>
