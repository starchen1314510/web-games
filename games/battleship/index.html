<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>海战棋 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">海战棋 <small>BATTLESHIP</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">海战棋</div>
                    <p class="overlay-desc" id="ov-desc">
                        10 × 10 的海域里各藏五艘军舰。轮流开火，命中就打叉，把对方五艘全部击沉。你先手。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始对局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">战况</div>
                    <div class="panel-row"><span>敌方剩余</span><b id="enemyleft">5</b></div>
                    <div class="panel-row"><span>我方剩余</span><b id="myleft">5</b></div>
                    <div class="panel-row"><span>命中率</span><b id="acc">--</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>胜场</span><b id="wins">0</b></div>
                    <div class="panel-row"><span>败场</span><b id="losses">0</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>开火</span><span>点击方格</span></div>
                        <div><span>重新布阵</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新布阵</button>
            </aside>
        </div>
    </div>

    <script src="battleship.js"></script>
</body>

</html>
