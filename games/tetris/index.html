<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>俄罗斯方块 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">俄罗斯方块 <small>TETRIS</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="board"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">俄罗斯方块</div>
                    <p class="overlay-desc" id="ov-desc">
                        方向键左右移动，上键旋转，空格直接落底。消除整行即可得分，等级越高方块下落越快。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始游戏</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">分数</div>
                    <div class="panel-value" id="score">0</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>等级</span><b id="level">1</b></div>
                    <div class="panel-row"><span>消行</span><b id="lines">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">下一个</div>
                    <canvas id="next"></canvas>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动</span><span><kbd>←</kbd> <kbd>→</kbd></span></div>
                        <div><span>旋转</span><span><kbd>↑</kbd></span></div>
                        <div><span>软降</span><span><kbd>↓</kbd></span></div>
                        <div><span>落底</span><span><kbd>Space</kbd></span></div>
                        <div><span>暂停</span><span><kbd>P</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="pause-btn">暂停 / 继续</button>
            </aside>
        </div>

        <div class="touch-pad" id="touch-pad">
            <div class="pad-group">
                <span class="pad-spacer"></span>
                <button class="pad-btn" data-act="rotate">旋转</button>
                <span class="pad-spacer"></span>
                <button class="pad-btn" data-act="left">←</button>
                <button class="pad-btn" data-act="down">↓</button>
                <button class="pad-btn" data-act="right">→</button>
                <span class="pad-spacer"></span>
                <button class="pad-btn" data-act="drop">落底</button>
                <span class="pad-spacer"></span>
            </div>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>

</html>
