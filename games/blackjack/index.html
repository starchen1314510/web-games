<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>21 点 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">21 点 <small>BLACKJACK</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">21 点</div>
                    <p class="overlay-desc" id="ov-desc">
                        尽量让手牌点数接近 21 但不超过。A 算 1 或 11，J/Q/K 算 10，庄家到 17 点必须停牌。
                    </p>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始发牌</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">桌面</div>
                    <div class="panel-row"><span>筹码</span><b id="chips">500</b></div>
                    <div class="panel-row"><span>下注</span><b id="bet">10</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">下注额</div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn btn-ghost btn-sm" id="bet-minus" style="flex:1;">− 10</button>
                        <button class="btn btn-ghost btn-sm" id="bet-plus" style="flex:1;">+ 10</button>
                    </div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>战绩</span><b id="stats">0 胜 · 0 负 · 0 平</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>要牌</span><span><kbd>H</kbd> / 空格</span></div>
                        <div><span>停牌</span><span><kbd>S</kbd></span></div>
                        <div><span>加倍</span><span><kbd>D</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-primary btn-sm" id="deal-btn">发牌</button>
                <button class="btn btn-ghost btn-sm" id="hit-btn">要牌</button>
                <button class="btn btn-ghost btn-sm" id="stand-btn">停牌</button>
                <button class="btn btn-ghost btn-sm" id="double-btn">加倍</button>
            </aside>
        </div>
    </div>

    <script src="blackjack.js"></script>
</body>

</html>
