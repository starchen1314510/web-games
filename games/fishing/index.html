<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>钓鱼 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">钓鱼 <small>FISHING</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">钓鱼</div>
                    <p class="overlay-desc" id="ov-desc">
                        移动鱼钩去碰鱼，上钩后连续点击把它拉上来。越深的鱼越值钱，小心铁罐和电鳗。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始垂钓</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本局</div>
                    <div class="panel-row"><span>得分</span><b id="score">0</b></div>
                    <div class="panel-row"><span>剩余时间</span><b id="time">60s</b></div>
                    <div class="panel-row"><span>连击</span><b id="combo">0</b></div>
                    <div class="panel-row"><span>上鱼数</span><b id="caught">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>已玩局数</span><b id="runs">0</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动鱼钩</span><span>鼠标 / 方向键</span></div>
                        <div><span>收线</span><span>连续点击 / <kbd>空格</kbd></span></div>
                        <div><span>重开</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="fishing.js"></script>
</body>

</html>
