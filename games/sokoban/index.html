<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>推箱子 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">推箱子 <small>SOKOBAN</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">推箱子</div>
                    <p class="overlay-desc" id="ov-desc">
                        把每个木箱推到圆点上。箱子只能推不能拉，推到墙角就再也动不了，走错可以按 Z 撤销。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>步数<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始挑战</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>重来本关</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">当前关卡</div>
                    <div class="panel-value" id="level">1 / 6</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>步数</span><b id="steps">0</b></div>
                    <div class="panel-row"><span>推动</span><b id="pushes">0</b></div>
                    <div class="panel-row"><span>箱子</span><b id="boxes">0 / 0</b></div>
                    <div class="panel-row"><span>最佳步数</span><b id="best">--</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">选关</div>
                    <div class="diff-group level-grid" id="level-group">
                        <button class="btn btn-ghost btn-sm active" data-level="0">1</button>
                        <button class="btn btn-ghost btn-sm" data-level="1">2</button>
                        <button class="btn btn-ghost btn-sm" data-level="2">3</button>
                        <button class="btn btn-ghost btn-sm" data-level="3">4</button>
                        <button class="btn btn-ghost btn-sm" data-level="4">5</button>
                        <button class="btn btn-ghost btn-sm" data-level="5">6</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动</span><span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span></div>
                        <div><span>撤销</span><span><kbd>Z</kbd></span></div>
                        <div><span>重来</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="undo-btn">撤销一步</button>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重来本关</button>
            </aside>
        </div>
    </div>

    <script src="sokoban.js"></script>
</body>

</html>
