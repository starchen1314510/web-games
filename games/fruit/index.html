<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>切水果 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">切水果 <small>FRUIT SLICE</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">切水果</div>
                    <p class="overlay-desc" id="ov-desc">
                        按住并划过水果把它切开，漏掉水果会损失一颗心。别切到炸弹，那会直接结束。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始切水果</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">分数</div>
                    <div class="panel-value" id="score">0</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>生命</span><b id="lives">♥ ♥ ♥</b></div>
                    <div class="panel-row"><span>连击</span><b id="combo">--</b></div>
                    <div class="panel-row"><span>切中</span><b id="cut">0</b></div>
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">轻松</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">普通</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">疯狂</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>切水果</span><span>按住滑动</span></div>
                        <div><span>重来</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="fruit.js"></script>
</body>

</html>
