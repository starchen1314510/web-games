<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拼图 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">拼图 <small>PICTURE PUZZLE</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">拼图</div>
                    <p class="overlay-desc" id="ov-desc">
                        点两块拼图交换位置，把打乱的画面还原。三档难度分别是 3×3、4×4 与 5×5，步数越少越好。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始拼图</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>换一局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">状态</div>
                    <div class="panel-value small" id="status">等待开始</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>步数</span><b id="moves">0</b></div>
                    <div class="panel-row"><span>归位</span><b id="done">0 / 16</b></div>
                    <div class="panel-row"><span>用时</span><b id="time">0:00</b></div>
                    <div class="panel-row"><span>最佳</span><b id="best-moves">--</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-diff="easy">3×3</button>
                        <button class="btn btn-ghost btn-sm active" data-diff="normal">4×4</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">5×5</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>交换</span><span>点两块拼图</span></div>
                        <div><span>看原图</span><span>按住 <kbd>H</kbd></span></div>
                        <div><span>重开</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新打乱</button>
            </aside>
        </div>
    </div>

    <script src="jigsaw.js"></script>

</body>

</html>
