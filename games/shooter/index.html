<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>太空射击 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">太空射击 <small>SPACE SHOOTER</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">太空射击</div>
                    <p class="overlay-desc" id="ov-desc">
                        飞船自动开火，左右移动躲开敌机与弹幕。击落足够多的敌机即可升级，小心别被撞到。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始游戏</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">得分</div>
                    <div class="panel-value" id="score">0</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>等级</span><b id="level">1</b></div>
                    <div class="panel-row"><span>生命</span><b id="lives">♥♥♥</b></div>
                    <div class="panel-row"><span>状态</span><b id="buff">常规</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动</span><span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></span></div>
                        <div><span>触屏</span><span>拖动飞船</span></div>
                        <div><span>暂停</span><span><kbd>P</kbd> / <kbd>Esc</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>

        <div class="touch-pad" id="touch-pad">
            <div class="pad-group">
                <button class="pad-btn" data-dir="left">←</button>
                <button class="pad-btn" data-dir="pause">⏸</button>
                <button class="pad-btn" data-dir="right">→</button>
            </div>
        </div>
    </div>

    <script src="shooter.js"></script>
</body>

</html>
