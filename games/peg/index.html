<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>孔明棋 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">孔明棋 <small>PEG SOLITAIRE</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">孔明棋</div>
                    <p class="overlay-desc" id="ov-desc">
                        棋子沿直线跳过相邻棋子，落入前方的空孔，被跳过的棋子会被吃掉。每一步必须跳吃，无法移动时棋局结束。剩子越少越厉害。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始挑战</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">状态</div>
                    <div class="panel-value small" id="status">等待开始</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>剩余棋子</span><b id="left">32</b></div>
                    <div class="panel-row"><span>已走步数</span><b id="steps">0</b></div>
                    <div class="panel-row"><span>最佳</span><b id="best">--</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">评级</div>
                    <div class="panel-value small" id="rank">--</div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">规则</div>
                    <div class="key-list">
                        <div><span>跳吃</span><span>隔一子落空格</span></div>
                        <div><span>剩 1 子</span><span>独步天下</span></div>
                        <div><span>剩 2-3 子</span><span>高手</span></div>
                        <div><span>剩 4-5 子</span><span>尚可</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="peg.js"></script>

</body>

</html>
