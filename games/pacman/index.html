<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>吃豆人 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">吃豆人 <small>PAC-MAN</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">吃豆人</div>
                    <p class="overlay-desc" id="ov-desc">
                        吃掉迷宫里所有的豆子，躲开四只幽灵。吃到能量豆后可以反过来吃掉它们。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始游戏</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本局</div>
                    <div class="panel-row"><span>得分</span><b id="score">0</b></div>
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>生命</span><b id="lives">♥♥♥</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">进度</div>
                    <div class="panel-row"><span>剩余豆子</span><b id="dots">0</b></div>
                    <div class="panel-row"><span>关卡</span><b id="level">1</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>方向键</span><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span></div>
                        <div><span>备用</span><span>WASD / 滑动</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="pacman.js"></script>
</body>

</html>
