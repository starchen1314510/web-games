<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>炸弹人 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">炸弹人 <small>BOMBERMAN</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">炸弹人</div>
                    <p class="overlay-desc" id="ov-desc">
                        放下炸弹炸开砖墙，清光所有敌人后走进出口。小心别被自己的爆炸波及。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始爆破</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本局</div>
                    <div class="panel-row"><span>得分</span><b id="score">0</b></div>
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>生命</span><b id="lives">♥♥♥</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">状态</div>
                    <div class="panel-row"><span>剩余敌人</span><b id="enemies">0</b></div>
                    <div class="panel-row"><span>火力</span><b id="power">1</b></div>
                    <div class="panel-row"><span>炸弹数</span><b id="bombs">1</b></div>
                    <div class="panel-row"><span>关卡</span><b id="level">1</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动</span><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></span></div>
                        <div><span>放炸弹</span><span><kbd>空格</kbd></span></div>
                        <div><span>触屏</span><span>点击画面</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="bomber.js"></script>
</body>

</html>
