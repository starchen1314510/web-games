<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>记忆翻牌 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">记忆翻牌 <small>MEMORY MATCH</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <div class="memory-board" id="board"></div>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">记忆翻牌</div>
                    <p class="overlay-desc" id="ov-desc">
                        每次翻开两张牌，图案相同即配对成功。用最少的步数找出全部配对。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>步数<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始游戏</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">步数</div>
                    <div class="panel-value" id="moves">0</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>用时</span><b id="time">0s</b></div>
                    <div class="panel-row"><span>配对</span><b id="pairs">0 / 8</b></div>
                    <div class="panel-row"><span>最佳步数</span><b id="best">--</b></div>
                </div>
                <div class="panel-box diff-panel">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm active" data-diff="easy">4×4</button>
                        <button class="btn btn-ghost btn-sm" data-diff="medium">5×4</button>
                        <button class="btn btn-ghost btn-sm" data-diff="hard">6×4</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>翻牌</span><span>点击 / 轻点</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="memory.js"></script>
</body>

</html>
