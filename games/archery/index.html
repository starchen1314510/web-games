<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>射箭 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">射箭 <small>ARCHERY</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">射箭</div>
                    <p class="overlay-desc" id="ov-desc">
                        按住画布瞄准并蓄力，松手出箭。箭会受重力和侧风影响，越靠近靶心分越高。每轮八支箭，侧风每箭都会变。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始射箭</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本轮</div>
                    <div class="panel-row"><span>总分</span><b id="score">0</b></div>
                    <div class="panel-row"><span>剩余箭</span><b id="left">8</b></div>
                    <div class="panel-row"><span>本箭</span><b id="last">--</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>瞄准</span><span>移动指针</span></div>
                        <div><span>蓄力射箭</span><span>按住松开</span></div>
                        <div><span>微调角度</span><span><kbd>↑</kbd><kbd>↓</kbd></span></div>
                        <div><span>重开</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开局</button>
            </aside>
        </div>
    </div>

    <script src="archery.js"></script>
</body>

</html>
