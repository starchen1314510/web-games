<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>飞镖 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">飞镖 <small>DARTS 501</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">飞镖 501</div>
                    <p class="overlay-desc" id="ov-desc">
                        从 501 分开始递减到 0，最后一次必须落在双倍环或红心。第一下点垂直摆线定左右，第二下定水平摆线。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始投镖</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本局</div>
                    <div class="panel-row"><span>剩余分数</span><b id="left">501</b></div>
                    <div class="panel-row"><span>本轮</span><b id="roundscore">0</b></div>
                    <div class="panel-row"><span>已用镖</span><b id="darts">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>最少镖数</span><b id="best">--</b></div>
                    <div class="panel-row"><span>完成局数</span><b id="record">0</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>定左右</span><span>点击 / <kbd>空格</kbd></span></div>
                        <div><span>定上下</span><span>再点一次</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="darts.js"></script>
</body>

</html>
