<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>记忆序列 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">记忆序列 <small>SIMON SAYS</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">记忆序列</div>
                    <p class="overlay-desc" id="ov-desc">
                        四块灯板会依次亮起并响起音调，记住顺序后按同样的次序点亮它们。每答对一轮，序列就会加长一格。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>得分<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始挑战</button>
                        <button class="btn btn-ghost" id="ov-restart" hidden>再来一次</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">状态</div>
                    <div class="panel-value small" id="status">等待开始</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>得分</span><b id="score">0</b></div>
                    <div class="panel-row"><span>序列长度</span><b id="level">0</b></div>
                    <div class="panel-row"><span>最佳</span><b id="best">0</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>左上</span><span>点灯 / <kbd>1</kbd></span></div>
                        <div><span>右上</span><span>点灯 / <kbd>2</kbd></span></div>
                        <div><span>左下</span><span>点灯 / <kbd>3</kbd></span></div>
                        <div><span>右下</span><span>点灯 / <kbd>4</kbd></span></div>
                    </div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">计分</div>
                    <div class="key-list">
                        <div><span>每轮</span><span>长度 × 100</span></div>
                        <div><span>整局</span><span>累计不清零</span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="simon.js"></script>

</body>

</html>
