<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>保龄球 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">保龄球 <small>BOWLING</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">保龄球</div>
                    <p class="overlay-desc" id="ov-desc">
                        移动鼠标选择站位，按住左键蓄力，松开投球。球出手后还能按方向键加旋转，十局比拼总分。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始第一局</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本局</div>
                    <div class="panel-row"><span>局数</span><b id="frame">1 / 10</b></div>
                    <div class="panel-row"><span>第几投</span><b id="roll">1</b></div>
                    <div class="panel-row"><span>剩余瓶</span><b id="pins">10</b></div>
                    <div class="panel-row"><span>总分</span><b id="total">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>最高分</span><b id="best">0</b></div>
                    <div class="panel-row"><span>全中次数</span><b id="strikes">0</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>选择站位</span><span>移动鼠标</span></div>
                        <div><span>蓄力 / 投球</span><span>按住 · 松开</span></div>
                        <div><span>加旋转</span><span><kbd>←</kbd><kbd>→</kbd></span></div>
                        <div><span>重开</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="bowling.js"></script>
</body>

</html>
