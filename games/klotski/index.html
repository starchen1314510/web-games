<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>华容道 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">华容道 <small>KLOTSKI</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">华容道</div>
                    <p class="overlay-desc" id="ov-desc">
                        四乘五的木盘上挤着十块棋子。拖动棋子腾挪空位，把两格见方的曹操挪到底部出口就算成功，步数越少越漂亮。
                    </p>
                    <div class="overlay-score" id="ov-score"></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始挪动</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">本局</div>
                    <div class="panel-row"><span>步数</span><b id="moves">0</b></div>
                    <div class="panel-row"><span>用时</span><b id="time">00:00</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">战绩</div>
                    <div class="panel-row"><span>最少步数</span><b id="best">--</b></div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动棋子</span><span>拖拽</span></div>
                        <div><span>逐格移动</span><span><kbd>↑↓←→</kbd></span></div>
                        <div><span>撤销</span><span><kbd>Z</kbd></span></div>
                        <div><span>重开</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="undo-btn">撤销一步</button>
                <button class="btn btn-ghost btn-sm" id="restart-btn">重新开始</button>
            </aside>
        </div>
    </div>

    <script src="klotski.js"></script>
</body>

</html>
