<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>迷宫逃亡 · 网页游戏厅</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
</head>

<body>
    <div class="game-page">
        <div class="game-topbar">
            <a class="back-link" href="../../index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M11 6l-6 6 6 6" />
                </svg>
                返回游戏厅
            </a>
            <div class="game-name">迷宫逃亡 <small>MAZE</small></div>
        </div>

        <div class="play-stage">
            <div class="canvas-wrap">
                <canvas id="stage"></canvas>
                <div class="stage-overlay show" id="overlay">
                    <div class="overlay-title" id="ov-title">迷宫逃亡</div>
                    <p class="overlay-desc" id="ov-desc">
                        从左上角走到右下角的出口。每局的迷宫都会重新生成，用最少的步数最快逃出去。
                    </p>
                    <div class="overlay-score" id="ov-score" hidden>步数<b id="ov-score-val">0</b></div>
                    <div class="overlay-actions">
                        <button class="btn btn-primary" id="ov-btn">开始探索</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="panel-box">
                    <div class="panel-title">用时</div>
                    <div class="panel-value" id="time">0.0s</div>
                </div>
                <div class="panel-box">
                    <div class="panel-row"><span>步数</span><b id="steps">0</b></div>
                    <div class="panel-row"><span>规模</span><b id="size">11 × 11</b></div>
                    <div class="panel-row"><span>最短步</span><b id="best-steps">--</b></div>
                    <div class="panel-row"><span>最快</span><b id="best-time">--</b></div>
                    <div class="panel-row"><span>通关数</span><b id="cleared">0</b></div>
                </div>
                <div class="panel-box">
                    <div class="panel-title">难度</div>
                    <div class="diff-group" id="diff-group">
                        <button class="btn btn-ghost btn-sm" data-size="11">轻松</button>
                        <button class="btn btn-ghost btn-sm active" data-size="15">普通</button>
                        <button class="btn btn-ghost btn-sm" data-size="19">困难</button>
                    </div>
                </div>
                <div class="panel-box help-box">
                    <div class="panel-title">操作</div>
                    <div class="key-list">
                        <div><span>移动</span><span>方向键 / 滑动</span></div>
                        <div><span>提示</span><span><kbd>H</kbd></span></div>
                        <div><span>换迷宫</span><span><kbd>R</kbd></span></div>
                    </div>
                </div>
                <button class="btn btn-ghost btn-sm" id="hint-btn">提示路线</button>
                <button class="btn btn-ghost btn-sm" id="restart-btn">换一个迷宫</button>
            </aside>
        </div>
    </div>

    <script src="maze.js"></script>
</body>

</html>
